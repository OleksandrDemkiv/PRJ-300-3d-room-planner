<div class="fixed left-0 top-0 h-screen w-64 bg-white/95 backdrop-blur-sm shadow-2xl z-20 overflow-y-auto">
    <div class="p-4">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
            <span class="text-2xl">🏠</span>
            Furniture Library
        </h2>
        
        <!-- Loading State -->
        <div *ngIf="isLoading" class="text-center py-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
            <p class="mt-4 text-gray-600">Loading products...</p>
        </div>

        <!-- Error State -->
        <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-700">
            {{ errorMessage }}
        </div>

        <!-- Products List -->
        <div class="space-y-2" *ngIf="!isLoading && !errorMessage">
            <button 
                *ngFor="let item of furnitureItems"
                (click)="onItemClick(item)"
                class="w-full p-3 bg-gradient-to-r from-gray-50 to-gray-100 
                                hover:from-indigo-50 hover:to-purple-50
                                border-2 border-gray-200 hover:border-indigo-400
                                rounded-lg transition-all duration-200
                                flex items-center gap-3 cursor-pointer
                                shadow-sm hover:shadow-md
                                transform hover:-translate-y-0.5
                                active:translate-y-0">
                <!-- Product Image -->
                <img 
                    [src]="item.imageUrl" 
                    [alt]="item.displayName"
                    class="w-16 h-16 object-cover rounded-md bg-gray-200"
                    (error)="$any($event.target).src='https://via.placeholder.com/64?text=No+Image'"
                />
                
                <!-- Product Info -->
                <div class="flex-1 text-left">
                    <div class="text-sm font-semibold text-gray-700">{{ item.displayName }}</div>
                    <div class="text-xs text-gray-500">${{ item.price }}</div>
                </div>
            </button>
        </div>
    </div>
</div>
