<!-- Room Configuration Modal -->
<app-room-config-modal 
    *ngIf="showConfigModal"
    (roomConfigured)="onRoomConfigured($event)">
</app-room-config-modal>

<!-- Controls Panel (only show after configuration) -->
<div *ngIf="!showConfigModal" class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm rounded-xl p-4 z-10 shadow-lg min-w-[180px]">
    <h3 class="m-0 mb-2 text-base text-gray-800 font-semibold">Room Settings</h3>
    
    <div class="flex items-center justify-between mb-1.5 text-sm">
        <label>Width:</label>
        <input type="number" [(ngModel)]="roomWidth" (input)="updateRoom()" step="0.1" 
                class="w-16 px-1 py-0.5 border border-gray-300 rounded" />
    </div>
    
    <div class="flex items-center justify-between mb-1.5 text-sm">
        <label>Height:</label>
        <input type="number" [(ngModel)]="roomHeight" (input)="updateRoom()" step="0.1" 
                class="w-16 px-1 py-0.5 border border-gray-300 rounded" />
    </div>
    
    <div class="flex items-center justify-between mb-1.5 text-sm">
        <label>Depth:</label>
        <input type="number" [(ngModel)]="roomDepth" (input)="updateRoom()" step="0.1" 
                class="w-16 px-1 py-0.5 border border-gray-300 rounded" />
    </div>

    <div class="flex items-center justify-between mb-1.5 text-sm">
        <label>Wall Color:</label>
        <input type="color" [(ngModel)]="wallColor" (input)="updateWallColor()" 
                class="border-none bg-transparent w-10 h-6 cursor-pointer" />
    </div>

    <div class="flex items-center justify-between mb-1.5 text-sm">
        <label>Floor Color:</label>
        <input type="color" [(ngModel)]="floorColor" (input)="updateFloorColor()" 
                class="border-none bg-transparent w-10 h-6 cursor-pointer" />
    </div>

    <div class="mt-3 pt-2 border-t border-gray-200">
        <button (click)="toggleCameraView()"
                class="w-full px-3 py-2 bg-gradient-to-br from-indigo-500 to-purple-600 text-white 
                        border-none rounded-md text-sm font-semibold cursor-pointer 
                        transition-all duration-300 shadow-md
                        hover:-translate-y-0.5 hover:shadow-lg
                        active:translate-y-0 active:shadow-sm">
            {{ isInsideView ? '📷 Outside View' : '🏠 Inside View' }}
        </button>
    </div>
</div>

<div *ngIf="selectedObject" 
        class="absolute top-4 left-1/2 -translate-x-1/2 
            bg-gradient-to-br from-cyan-400 to-blue-600 text-white 
            px-5 py-3 rounded-xl shadow-lg shadow-blue-500/40 z-[15]
            animate-slideDown">
    <div class="flex items-center gap-3">
        <span class="text-2xl">🪑</span>
        <div class="flex flex-col gap-1">
            <strong class="text-base capitalize">{{ selectedObject.name }}</strong>
            <div class="flex gap-4 text-[13px] opacity-90">
                <span class="flex items-center gap-1">🖱️ Drag to move</span>
                <span class="flex items-center gap-1">🔄 Scroll to rotate ({{ currentRotationDegrees }}°)</span>
            </div>
        </div>
    </div>
</div>

<div #rendererContainer class="w-full h-screen block bg-gray-100"></div>
